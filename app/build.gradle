plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt)
}

// Versión: única fuente de verdad en version.properties (ver docs/VERSIONING.md).
def versionProps = new Properties()
file("../version.properties").withInputStream { versionProps.load(it) }
def vMajor = versionProps['VERSION_MAJOR'] as int
def vMinor = versionProps['VERSION_MINOR'] as int
def vPatch = versionProps['VERSION_PATCH'] as int

android {
    namespace 'com.estatica'
    compileSdk 35

    defaultConfig {
        applicationId 'com.estatica'
        minSdk 26
        targetSdk 35
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName "${vMajor}.${vMinor}.${vPatch}"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation"  : "$projectDir/schemas".toString(),
                        "room.incremental"     : "true",
                        "room.generateKotlin"  : "false"
                ]
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    sourceSets {
        // Esquemas exportados de Room disponibles para tests de migración.
        test.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation libs.androidx.core
    implementation libs.androidx.activity
    implementation libs.androidx.recyclerview
    implementation libs.androidx.constraintlayout
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata

    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    implementation libs.hilt.android
    annotationProcessor libs.hilt.compiler

    implementation libs.gson
    implementation libs.work.runtime
    // QR codes for RADIO → LINK (show and scan). Pulls in zxing core.
    implementation libs.zxing.embedded

    testImplementation libs.junit
}
